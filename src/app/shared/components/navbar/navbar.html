<!-- Barra de navegación principal -->
<nav class="navbar bg-stone-900 text-stone-100 shadow-lg px-4 md:px-8 relative z-50">

  <!-- Logo / Título -->
  <div class="flex-1">
    <a routerLink="/"
      class="btn btn-ghost text-xl font-extrabold tracking-tight text-white hover:bg-stone-800 transition-colors">
      <span class="text-blue-500 mr-1">∑</span> Ing. para Todos
    </a>
  </div>

  <!-- Menú Desktop (Oculto en móviles) -->
  <div class="flex-none hidden md:flex gap-2 items-center">
    <a routerLink="/" routerLinkActive="text-blue-400 bg-stone-800" [routerLinkActiveOptions]="{exact: true}"
      class="btn btn-ghost hover:bg-stone-800 font-medium">
      Inicio
    </a>

    <!-- NUEVO: Botón de Sugerir Ejercicio -->
    <a routerLink="/sugerir-ejercicio" routerLinkActive="text-blue-400 bg-stone-800"
      class="btn btn-ghost hover:bg-stone-800 font-medium">
      Sugerir Ejercicio
    </a>


    <div class="divider divider-horizontal mx-0 before:bg-stone-700 after:bg-stone-700"></div>

    <a routerLink="/login" routerLinkActive="text-blue-400 bg-stone-800"
      class="btn btn-ghost hover:bg-stone-800 font-medium">
      Iniciar Sesión
    </a>
    <a routerLink="/registro"
      class="btn bg-blue-600 hover:bg-blue-700 text-white border-none ml-2 font-semibold shadow-md">
      Regístrate
    </a>
  </div>

  <!-- Botón Hamburguesa Mobile (Oculto en Desktop) -->
  <div class="flex-none md:hidden">
    <button class="btn btn-square btn-ghost hover:bg-stone-800 text-white" (click)="toggleMenu()">
      @if (!isMobileMenuOpen()) {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        class="inline-block w-6 h-6 stroke-current">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      } @else {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        class="inline-block w-6 h-6 stroke-current">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
      }
    </button>
  </div>
</nav>

<!-- Menú Desplegable Mobile -->
@if (isMobileMenuOpen()) {
<div
  class="md:hidden bg-stone-800 text-stone-100 px-4 pt-2 pb-6 space-y-2 shadow-2xl absolute w-full z-40 border-t border-stone-700">
  <a routerLink="/" (click)="closeMenu()" routerLinkActive="text-blue-400 bg-stone-900"
    [routerLinkActiveOptions]="{exact: true}"
    class="block px-4 py-3 hover:bg-stone-700 rounded-lg font-medium transition-colors">
    Inicio
  </a>

  <!-- NUEVO: Botón de Sugerir Ejercicio Mobile -->
  <a routerLink="/sugerir-ejercicio" (click)="closeMenu()" routerLinkActive="text-blue-400 bg-stone-900"
    class="block px-4 py-3 hover:bg-stone-700 rounded-lg font-medium transition-colors">
    Sugerir Ejercicio
  </a>


  <a routerLink="/login" (click)="closeMenu()" routerLinkActive="text-blue-400 bg-stone-900"
    class="block px-4 py-3 hover:bg-stone-700 rounded-lg font-medium transition-colors">
    Iniciar Sesión
  </a>
  <a routerLink="/registro" (click)="closeMenu()"
    class="block px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-center mt-4 font-semibold shadow-md transition-colors">
    Regístrate
  </a>
</div>
}
