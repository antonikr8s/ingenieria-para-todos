<section class="min-h-[calc(100vh-140px)] bg-stone-50 px-4 py-16">
  <div class="mx-auto max-w-lg rounded-2xl border border-stone-200 bg-white p-8 text-center shadow-sm">
    <div class="mb-4 text-4xl" aria-hidden="true">✉</div>
    <h1 class="text-3xl font-bold text-stone-900">Revisa tu correo</h1>
    @if (user()) {
      <p class="mt-4">Te enviamos un enlace de verificación a <strong>{{ user()?.email }}</strong>. Ábrelo y luego vuelve aquí.</p>
      <p class="mt-2 text-sm text-stone-600">Si no te llega, revisa la carpeta de spam.</p>
      <button type="button" (click)="resend()" [disabled]="remaining() > 0 || busy()" class="mt-6 w-full rounded-lg border border-blue-700 p-3 font-medium text-blue-800 disabled:border-stone-300 disabled:text-stone-400">
        {{ remaining() > 0 ? 'Reenviar en ' + remaining() + ' s' : 'Reenviar correo de verificación' }}
      </button>
      <button type="button" (click)="check()" [disabled]="busy()" class="mt-3 w-full rounded-lg bg-blue-600 p-3 font-semibold text-white disabled:opacity-60">Ya verifiqué mi correo</button>
      <button type="button" (click)="changeAccount()" class="mt-4 text-sm text-blue-700 underline">Usar otra cuenta</button>
    } @else {
      <p class="mt-4">Inicia sesión para verificar tu correo.</p>
      <a routerLink="/login" class="mt-4 inline-block text-blue-700 underline">Iniciar sesión</a>
    }
    @if (message()) { <p role="status" class="mt-4 text-sm">{{ message() }}</p> }
  </div>
</section>
