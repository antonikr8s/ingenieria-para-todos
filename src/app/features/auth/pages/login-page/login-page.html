<div class="w-full min-h-[calc(100vh-140px)] flex flex-col items-center justify-center px-4 py-8 bg-stone-50">
    <section class="w-full max-w-md space-y-8">

        <header class="space-y-3 text-center">
            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600">Bienvenido de nuevo</p>
            <h1 class="text-3xl font-bold tracking-tight text-stone-800 md:text-4xl">
                Iniciar Sesión
            </h1>
            <p class="leading-7 text-stone-500">
                Ingresa con tu cuenta para acceder a la plataforma.
            </p>
        </header>

        <section class="space-y-4 bg-white p-8 rounded-2xl border border-stone-200 shadow-sm">

            @if (errorMessage()) {
            <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
                {{ errorMessage() }}
            </div>
            }

            <button type="button" (click)="ingresarConGoogle()" [disabled]="cargando()"
                class="w-full flex items-center justify-center gap-3 rounded-lg border border-stone-300 bg-white px-4 py-3 text-sm font-semibold text-stone-700 transition-all hover:bg-stone-50 hover:border-blue-300 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Ingresar con Google
            </button>



            <button type="button" (click)="ingresarConMicrosoft()" [disabled]="cargando()"
                class="w-full flex items-center justify-center gap-3 rounded-lg border border-stone-300 bg-white px-4 py-3 text-sm font-semibold text-stone-700 transition-all hover:bg-stone-50 hover:border-blue-300 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-5 h-5" viewBox="0 0 23 23">
                    <path fill="#f35325" d="M1 1h10v10H1z" />
                    <path fill="#81bc06" d="M12 1h10v10H12z" />
                    <path fill="#05a6f0" d="M1 12h10v10H1z" />
                    <path fill="#ffba08" d="M12 12h10v10H12z" />
                </svg>
                Ingresar con Microsoft
            </button>

            @if (cargando()) {
            <p class="text-center text-sm text-stone-500 animate-pulse">Ingresando...</p>
            }

        </section>

        <p class="text-center text-xs text-stone-400">
            Al iniciar sesión aceptas usar tu cuenta de Google o Microsoft para identificarte en esta plataforma.
        </p>

    </section>
</div>
