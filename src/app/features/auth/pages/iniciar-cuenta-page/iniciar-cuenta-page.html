<div class="w-full min-h-[calc(100vh-140px)] flex flex-col items-center justify-center px-4 py-8 bg-stone-50">
    <section class="w-full max-w-md space-y-8">

        <header class="space-y-3 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-blue-600 md:text-4xl">
                Ruta interna: Iniciar con cuenta de prueba
            </h1>
        </header>

        <form [formGroup]="form" (ngSubmit)="onSubmit()"
            class="space-y-5 bg-white p-8 rounded-2xl border border-stone-200 shadow-sm">

            <div class="space-y-2 text-left">
                <label for="email" class="block text-sm font-semibold text-stone-700">Email</label>
                <input id="email" type="email"
                    class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-3 text-stone-800 placeholder-stone-400 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none transition-all"
                    formControlName="email">

                @if(email.touched && email.hasError('required')){
                <p class="text-xs text-red-500 mt-1">El correo electrónico es requerido</p>
                }
            </div>

            <div class="space-y-2 text-left">
                <label for="password" class="block text-sm font-semibold text-stone-700">Contraseña</label>
                <div class="relative">
                    <input id="password" [type]="showPassword() ? 'text' : 'password'"
                        class="w-full rounded-lg border border-stone-300 bg-stone-50 py-3 pl-4 pr-28 text-stone-800 placeholder-stone-400 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none transition-all"
                        formControlName="password">

                    <button type="button" (click)="togglePassword()" tabindex="-1"
                        class="absolute inset-y-0 right-0 flex items-center pr-4 text-xs font-mono tracking-wider text-blue-600 font-bold">
                        @if (showPassword()) { OCULTAR } @else { MOSTRAR }
                    </button>
                </div>
            </div>

            @if (errorMessage()) {
              <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
                {{ errorMessage() }}
              </div>
            }

            <button type="submit" [disabled]="form.invalid || cargando()"
                class="mt-2 w-full rounded-lg bg-blue-600 px-4 py-3 font-bold tracking-widest uppercase text-white transition-all hover:bg-blue-700 disabled:bg-stone-200 disabled:text-stone-400 disabled:cursor-not-allowed">
                @if (cargando()) { Ingresando... } @else { Ingresar }
            </button>

            <div class="pt-4 text-center border-t border-stone-200 mt-6">
                <a routerLink="/crear-cuenta" class="text-blue-600 hover:text-blue-800 transition-colors font-semibold text-sm">
                    ¿No tienes cuenta de prueba? Créala aquí
                </a>
            </div>

        </form>
    </section>
</div>
